# dsh bundle layer: mount the behavior-enhancer plugin.
- insert:
    - id: behavior-enhancer
      name: '@zoria-lind/dsh-behavior-enhancer'
      config:
        # v1.2(B1/B2/B3/B4/B5/B7):默认即启用;各节含义见 README
        writeDiffVerify:
          enabled: true
          gitStatusOnPwsh: true
          writeDiffTimeoutMs: 5000
          writeDiffMaxLines: 400
        hardGate:
          enabled: true
          maxStrikes: 3
          highRiskMode: 'ask'   # 无审批服务时内核把 ask 降级为 deny
        verifyLoop:
          enabled: true
        compliance:
          enabled: true
          # 落盘改 D 盘(用户既定偏好:凡能放 D 盘就放 D 盘);绝对路径原样使用不展开 ~
          statsPath: 'D:/dsh/behavior-enhancer/stats.json'
